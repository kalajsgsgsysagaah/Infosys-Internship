name: BugFlow CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python -m compileall -q server.py tests
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Test dialog close controls
        run: node --test tests/modal_controls.test.cjs
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Sync linked BugFlow issues
        if: ${{ always() && env.BUGFLOW_WEBHOOK_URL != '' && env.BUGFLOW_WEBHOOK_SECRET != '' }}
        env:
          BUGFLOW_WEBHOOK_URL: ${{ vars.BUGFLOW_WEBHOOK_URL }}
          BUGFLOW_WEBHOOK_SECRET: ${{ secrets.BUGFLOW_WEBHOOK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, re, urllib.request
          with open(os.environ['EVENT_PATH'], encoding='utf-8') as event_file:
              event = json.load(event_file)
          messages = [c.get('message', '') for c in event.get('commits', [])]
          if event.get('pull_request'):
              messages += [event['pull_request'].get('title', ''), event['pull_request'].get('body', '')]
          issue_ids = sorted(set(re.findall(r'BF-\d+', '\n'.join(messages))))
          if issue_ids:
              body = json.dumps({'conclusion': 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure', 'issueIds': issue_ids}).encode()
              signature = hmac.new(os.environ['BUGFLOW_WEBHOOK_SECRET'].encode(), body, hashlib.sha256).hexdigest()
              request = urllib.request.Request(os.environ['BUGFLOW_WEBHOOK_URL'].rstrip('/') + '/api/integrations/github/status', data=body, headers={'Content-Type': 'application/json', 'X-Hub-Signature-256': 'sha256=' + signature}, method='POST')
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(response.read().decode())
          else:
              print('No BF-123 issue references found in this push or pull request.')
